[package]
name = "heartmula-studio"
version = "0.3.2"
description = "A native HeartMuLa music production studio"
authors = ["The Kraken"]
edition = "2021"

[lib]
name = "heartmula_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
ureq = "2"
